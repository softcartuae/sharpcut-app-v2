name: sharp_cut
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  gradient_borders: ^1.0.2
  intl: ^0.20.2
  device_preview: ^1.3.1
  dio: ^5.7.0
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  shared_preferences: ^2.5.3
  get_it: ^9.2.0
  fluttertoast: ^9.0.0
  dartz: ^0.10.1
  cached_network_image: ^3.4.1
  collection: ^1.19.1
  # flutter_thermal_printer: ^1.2.4
  # esc_pos_utils_plus: ^2.0.4
  # permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - lib/utils/images/

  fonts:
    - family: Poppins
      fonts:
        - asset: lib/utils/fonts/Poppins-Regular.ttf
        - asset: lib/utils/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: lib/utils/fonts/Poppins-Italic.ttf
          style: italic
        - asset: lib/utils/fonts/Poppins-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: lib/utils/fonts/Poppins-Black.ttf
          weight: 900
        - asset: lib/utils/fonts/Poppins-BlackItalic.ttf
          weight: 900
          style: italic
        - asset: lib/utils/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: lib/utils/fonts/Poppins-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: lib/utils/fonts/Poppins-ExtraLight.ttf
          weight: 200
        - asset: lib/utils/fonts/Poppins-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: lib/utils/fonts/Poppins-Light.ttf
          weight: 300
        - asset: lib/utils/fonts/Poppins-LightItalic.ttf
          weight: 300
          style: italic
        - asset: lib/utils/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: lib/utils/fonts/Poppins-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: lib/utils/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: lib/utils/fonts/Poppins-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: lib/utils/fonts/Poppins-Thin.ttf
          weight: 100
        - asset: lib/utils/fonts/Poppins-ThinItalic.ttf
          weight: 100
          style: italic
